name: Build iOS IPA (Dragon Blue)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Compile Xcode & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Xcode Project
        run: |
          mkdir -p xcode_work
          if [ -d "PROJECT_NRO_ANWIN/PROJECT_NRO_248_6Tab/Builds/iOS" ]; then
            echo "Found local Xcode project in repo"
            cp -r PROJECT_NRO_ANWIN/PROJECT_NRO_248_6Tab/Builds/iOS/* xcode_work/
          elif [ -d "Builds/iOS" ]; then
            echo "Found local Builds/iOS"
            cp -r Builds/iOS/* xcode_work/
          else
            echo "Fetching exported Xcode bundle from Dragon Blue Cloud..."
            curl -fSL -o xcode.zip https://dragonblue.online/downloads/DragonBlue_iOS_Xcode.zip
            unzip -q xcode.zip -d xcode_work
          fi
          echo "Project directory structure:"
          ls -la xcode_work

      - name: Setup Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          cd xcode_work
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          cd xcode_work
          APP_DIR=$(find ./DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Found app bundle: $APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r -9 ../DragonBlue.ipa Payload
          cd ..
          ls -lh DragonBlue.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonBlue-iOS-IPA
          path: DragonBlue.ipa
          retention-days: 30

      - name: Deploy IPA to Dragon Blue Server (Optional)
        if: env.VPS_PASSWORD != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '103.178.235.89' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '7952' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          brew install sshpass
          sshpass -p "$VPS_PASSWORD" scp -P "$VPS_PORT" -o StrictHostKeyChecking=no DragonBlue.ipa "$VPS_USER@$VPS_HOST:/root/AWN/web/public/downloads/DragonBlue.ipa"
          echo "IPA successfully deployed to web server!"
